name: Gerar instalador

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    outputs:
      versao: ${{ steps.v.outputs.versao }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Testes
        run: python -m pytest -q tests
      - name: Versão
        id: v
        shell: bash
        run: echo "versao=$(python installer/versao.py)" >> "$GITHUB_OUTPUT"
      - name: Conferir tag e versão
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "${{ steps.v.outputs.versao }}"
      - name: Programa
        run: pyinstaller --noconfirm --distpath build/dist --workpath build/work notara.spec
      - name: WebView2 (instalador oficial da Microsoft)
        shell: pwsh
        run: Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile installer/MicrosoftEdgeWebview2Setup.exe
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Instalador
        shell: pwsh
        env:
          NOTARA_VERSAO: ${{ steps.v.outputs.versao }}
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\notara.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: dist/*.exe

  publicar:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: instalador
      - name: Publicar versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.exe --repo "$GITHUB_REPOSITORY" --title "Notara ${{ needs.build.outputs.versao }}" --generate-notes
