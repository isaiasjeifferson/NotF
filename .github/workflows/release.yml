name: Gerar instalador

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    outputs:
      versao: ${{ steps.v.outputs.versao }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Testes
        run: python -m pytest -q tests
      - name: Versão
        id: v
        shell: bash
        run: echo "versao=$(python installer/versao.py)" >> "$GITHUB_OUTPUT"
      - name: Programa
        run: pyinstaller --noconfirm --distpath build/dist --workpath build/work notara.spec
      - name: Autoteste do programa empacotado
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build/dist/NotF/NotF.exe" -ArgumentList "--verificar" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "O programa empacotado falhou no autoteste (código $($p.ExitCode))" }
      - name: WebView2 (instalador oficial da Microsoft)
        shell: pwsh
        run: Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile installer/MicrosoftEdgeWebview2Setup.exe
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Instalador
        shell: pwsh
        env:
          NOTARA_VERSAO: ${{ steps.v.outputs.versao }}
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\notara.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: dist/*.exe

  publicar:
    # Publica quando a versão em notara/__init__.py ainda não tem release.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: instalador
      - name: Publicar versão
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.versao }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A versão $TAG já foi publicada. Para publicar, aumente a versão em notara/__init__.py."
            exit 0
          fi
          # cópia com o nome antigo: versões anteriores (Notara) procuram este arquivo para se atualizar
          cp "NotF-${{ needs.build.outputs.versao }}-Instalar.exe" "Notara-${{ needs.build.outputs.versao }}-Instalar.exe"
          gh release create "$TAG" *.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "NotF ${{ needs.build.outputs.versao }}" --generate-notes
