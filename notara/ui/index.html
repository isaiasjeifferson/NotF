<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<title>NotF</title>
<style>
:root{
  --bg:#F5F5F7;--card:#FFF;--label:#1D1D1F;--label2:#6E6E73;--label3:#AEAEB2;
  --sep:rgba(60,60,67,.13);--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.07);
  --blue:#EA6A0C;--accent-fill:rgba(234,106,12,.12);--green:#34C759;--red:#FF3B30;--orange:#C98800;--scrim:rgba(0,0,0,.25);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);--r:12px;
  font-family:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
:root[data-tema=escuro]{color-scheme:dark;
  --bg:#000;--card:#1C1C1E;--label:#F5F5F7;--label2:#98989D;--label3:#636366;
  --sep:rgba(84,84,88,.55);--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.14);
  --blue:#FF8A2E;--accent-fill:rgba(255,138,46,.18);--green:#30D158;--red:#FF453A;--orange:#FFC233;--scrim:rgba(0,0,0,.6);--shadow:none}
:root[data-tema=escuro] .sheet{background:#1C1C1E}
:root[data-tema=escuro] .sheet .group,:root[data-tema=escuro] .resultados,:root[data-tema=escuro] .menu{background:#2C2C2E}
:root[data-tema=escuro] .seg button[aria-selected=true],:root[data-tema=escuro] .seg button[aria-checked=true]{background:#636366}
:root[data-tema=escuro] .busca-cli input{background:#1C1C1E}
:root[data-tema=escuro] .toast{background:rgba(58,58,60,.96)}
@media (prefers-reduced-motion:reduce){*:not(.spin){animation:none!important;transition:none!important}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--label);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:default}
input,textarea,select{font:inherit;color:var(--label);user-select:text}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent);outline-offset:1px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.spacer{flex:1}
[hidden]{display:none!important}

header{padding:20px 32px 12px;display:flex;align-items:flex-end;gap:14px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--label2);font-size:13px;margin-top:2px;display:flex;gap:8px;align-items:center}
.empresa-btn{color:var(--label2);font-size:13px;display:inline-flex;gap:5px;align-items:center;padding:2px 6px;margin-left:-6px;border-radius:6px;max-width:420px}
.empresa-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empresa-btn:hover{background:var(--fill2)}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--fill);color:var(--label2);white-space:nowrap}
.badge.prod{background:rgba(52,199,89,.15);color:var(--green)}
.badge.teste{background:rgba(255,149,0,.15);color:var(--orange)}
.badge.cancel{background:rgba(255,59,48,.12);color:var(--red)}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{padding:5px 15px;border-radius:7px;font-size:13px;font-weight:500}
.seg button[aria-selected=true],.seg button[aria-checked=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.35}
.icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--label2)}
.icon-btn:hover{background:var(--fill2)}

main{flex:1;overflow:auto;padding:0 32px 24px}
.view{display:none;max-width:860px;margin:0 auto}
.view.on{display:block;animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(4px)}}

.banner{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:var(--r);margin:4px 0 8px;font-size:13px}
.banner.warn{background:rgba(255,149,0,.12)} .banner.info{background:rgba(0,122,255,.10)} .banner.erro{background:rgba(255,59,48,.10)}
.banner .btn{padding:5px 12px;font-size:13px}
.group{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.gt{font-size:13px;color:var(--label2);margin:20px 16px 6px;display:flex;justify-content:space-between;gap:12px}
.row{display:flex;align-items:center;gap:14px;padding:11px 16px;position:relative;min-height:56px;width:100%;text-align:left}
.row+.row::before,.field+.field::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--sep)}
.row.click:hover{background:var(--fill2)}
.main{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:8px;align-items:center}
.s{color:var(--label2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v{font-weight:600;white-space:nowrap}
.del{opacity:0;color:var(--label3);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.row:hover .del,.del:focus-visible{opacity:1} .del:hover{color:var(--red);background:var(--fill2)}
.st{width:20px;height:20px;flex:none;display:grid;place-items:center}
.st.ok{color:var(--green)} .st.erro{color:var(--red)} .st.incerto{color:var(--orange)}
.err{color:var(--red);font-size:12.5px;white-space:normal} .err.warn{color:var(--orange)}
.err small{color:var(--label2);margin-left:6px}
.spin{width:16px;height:16px;border:2px solid var(--fill);border-top-color:var(--blue);border-radius:50%;animation:r .7s linear infinite;flex:none}
@keyframes r{to{transform:rotate(360deg)}}
.link{color:var(--blue);font-weight:500;font-size:13px;padding:4px 8px;border-radius:6px;white-space:nowrap}
.link:hover{background:var(--fill2)}
.grupo{margin-top:14px}
.progresso{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;margin:4px 0 6px}
.progresso .topo{display:flex;align-items:baseline;gap:10px}
.progresso .topo b{font-size:15px}
.progresso .pct{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.trilho{height:8px;border-radius:99px;background:var(--fill);margin:10px 0 8px;overflow:hidden;position:relative}
.trilho i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--blue);transition:width .5s ease}
.trilho i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:brilho 1.4s linear infinite}
.trilho.fim i{background:var(--green)} .trilho.fim-erro i{background:var(--orange)} .trilho.fim i::after,.trilho.fim-erro i::after{display:none}
@keyframes brilho{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.progresso .agora{font-size:13px;color:var(--label2);display:flex;gap:8px;align-items:center;min-height:20px}
.progresso .cont{display:flex;gap:16px;font-size:12.5px;color:var(--label2);margin-top:6px}
.progresso .cont b{color:var(--label)}
.row.ativa{background:color-mix(in srgb,var(--blue) 8%,transparent)}
.row.ativa .s.etapa{color:var(--blue)}
.fila{font-size:11px;color:var(--label3);font-weight:600;width:22px;text-align:center;flex:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 4px}
.stats div{background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--label2)}
.voltar{color:var(--blue);font-weight:500;padding:4px 6px;margin-left:-6px;border-radius:6px}
.voltar:hover{background:var(--fill2)}
.gcab{display:flex;gap:10px;align-items:center;padding:10px 12px 8px}
.gcab .t{font-size:13.5px}
.acao{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--label2);flex:none}
.acao:hover{background:var(--fill);color:var(--blue)} .acao.red:hover{color:var(--red)}
.check-n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--label3);display:grid;place-items:center;color:#fff;flex:none}
.check-n[aria-checked=true]{background:var(--blue);border-color:var(--blue)}
.row.apagada .t,.row.apagada .s{color:var(--label3)}
@keyframes skeleton{0%{background-position:100% 0}100%{background-position:-100% 0}}
.field.carregando input{color:transparent;border-radius:6px;background:linear-gradient(90deg,var(--fill) 25%,var(--fill2) 50%,var(--fill) 75%);background-size:200% 100%;animation:skeleton 1.1s linear infinite}
.barra-sel{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--card);padding:10px 12px 10px 18px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:40;min-width:620px}
.barra-sel .n{font-weight:600;white-space:nowrap}
.filtro{display:flex;align-items:center}
:root{--dur-1:120ms;--dur-2:200ms;--ease:cubic-bezier(.2,.8,.2,1);--ease-pop:cubic-bezier(.3,1.25,.5,1)}
.scrim.saindo{animation:fadeout var(--dur-1) forwards} .scrim.saindo .sheet{animation:popout var(--dur-1) forwards}
@keyframes fadeout{to{opacity:0}} @keyframes popout{to{opacity:0;transform:scale(.97)}}
.menu{animation:menuin var(--dur-1) var(--ease-pop);transform-origin:top left} @keyframes menuin{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.check-n{transition:background var(--dur-1),border-color var(--dur-1),transform var(--dur-1)} .check-n:active{transform:scale(.88)}
.check-n[aria-checked=true] svg{animation:menuin var(--dur-2) var(--ease-pop)}
.btn{transition:transform var(--dur-1) var(--ease),background var(--dur-1),opacity var(--dur-1)} .btn:active:not(:disabled){transform:scale(.97)}
.seg button{transition:background var(--dur-2) var(--ease),box-shadow var(--dur-2)}
.barra-sel{animation:subir var(--dur-2) var(--ease)} @keyframes subir{from{opacity:0;transform:translate(-50%,12px)}}
.view.on,.a-pane:not([hidden]){animation:fadein var(--dur-2) var(--ease)} @keyframes fadein{from{opacity:0;transform:translateY(3px)}}
.row.click,.field.click{transition:background var(--dur-1)}
.sheet.larga{width:min(720px,94vw)}
.row.srv{align-items:flex-start;padding:14px 16px} .row.srv .d{font-size:14px;line-height:1.4;margin:3px 0 4px;white-space:normal} .row.srv .s{white-space:normal;line-height:1.35}
.acoes-srv{display:flex;gap:2px;flex:none}
label.req::after{content:" *";color:var(--blue)}
.menu.saindo{animation:menuout var(--dur-1) forwards;pointer-events:none} @keyframes menuout{to{opacity:0;transform:scale(.97) translateY(-3px)}}
details[open]>*:not(summary){animation:fadein var(--dur-2) var(--ease)}
.perfis.saindo{animation:menuout var(--dur-1) forwards;pointer-events:none} .perfis{transform-origin:top right;animation:menuin var(--dur-2) var(--ease-pop)!important}
.aj-cab{display:flex;align-items:center;gap:14px;margin:2px 0 14px}
.aj-logo{position:relative;width:64px;height:64px;border-radius:16px;flex:none;padding:0;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px var(--sep)} .aj-logo img{width:100%;height:100%;object-fit:contain} .aj-logo .avatar{border-radius:16px} .aj-logo .lapis{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;opacity:0;transition:opacity .15s} .aj-logo:hover .lapis,.aj-logo:focus-visible .lapis{opacity:1}
.pk-res{max-height:420px;overflow:auto} .pk-res .row{min-height:60px;padding:12px 16px;gap:12px} .pk-res .t{font-size:14px;margin-bottom:2px} .pk-res .s{white-space:normal;line-height:1.35}
.lupa{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:0 12px;height:38px;color:var(--label2);margin-bottom:10px} .lupa input{flex:1;border:0;outline:0;background:none;text-align:left;font:inherit;color:var(--label);height:100%}
.pk-passo{font-size:12px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.04em;margin:4px 4px 8px}
.row.cancelada .t,.row.cancelada .s,.row.cancelada .v{color:var(--label3)} .row.cancelada .v{text-decoration:line-through} .row.cancelada{background:color-mix(in srgb,var(--label3) 8%,transparent)}
.row .ck{width:18px;flex:none;color:var(--blue)} .badge.ind{background:var(--accent-fill);color:var(--blue)}
.more{width:30px;height:28px;border-radius:7px;color:var(--label2);display:grid;place-items:center;flex:none}
.more:hover{background:var(--fill)}

.empty{margin-top:7vh;text-align:center;padding:48px 24px;border:1.5px dashed var(--sep);border-radius:18px;transition:.2s}
.drag #vazio{border-color:var(--blue);background:rgba(0,122,255,.05)}
.empty svg{color:var(--label3);margin-bottom:14px}
.empty h2{font-size:19px;font-weight:600}
.empty p{color:var(--label2);margin:6px 0 22px}
.actions{display:flex;gap:10px;justify-content:center}
kbd{font:inherit;font-size:12px;padding:1px 6px;border-radius:5px;background:var(--fill);color:var(--label2)}

.btn{padding:8px 18px;border-radius:9px;font-weight:600;background:var(--fill);color:var(--blue);white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.red{background:var(--red);color:#fff}
.btn.big{padding:11px 22px;font-size:15px;border-radius:11px}
.btn:disabled{opacity:.4;pointer-events:none}

footer{display:none;padding:12px 32px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--sep)}
footer.on{display:block}
footer .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px}
.tot{font-size:13px;color:var(--label2);min-width:170px} .tot b{color:var(--label);font-size:17px;display:block}
.barra{height:3px;border-radius:2px;background:var(--fill);margin-top:6px;overflow:hidden} .barra i{display:block;height:100%;background:var(--blue);transition:width .3s}

.field{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:46px;position:relative;width:100%;text-align:left}
.field>label,.field>.lbl{width:170px;flex:none}
.field input,.field textarea,.field select{flex:1;border:0;outline:0;background:none;text-align:right;padding:12px 0;min-width:0}
.field select{text-align-last:right;appearance:none;padding-right:2px}
.field textarea{text-align:left;resize:none;min-height:64px}
.field .val{flex:1;text-align:right;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field.col{flex-direction:column;align-items:stretch;gap:0;padding-top:10px}
.field.col>label{width:auto;font-size:12.5px;color:var(--label2)}
.field.col input{text-align:left}
.field.click:hover{background:var(--fill2)}
.field.invalido{box-shadow:inset 3px 0 0 var(--red)}
.field.invalido label{color:var(--red)}
.unit{color:var(--label2)}
input::-ms-reveal,input::-ms-clear{display:none}
.olho{color:var(--blue);font-size:13px;font-weight:500;padding:4px 6px;border-radius:6px;flex:none}
.olho:hover{background:var(--fill2)}
.aparencia{position:fixed;top:14px;right:18px;z-index:6;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--label2)}
.aparencia .seg button{padding:3px 10px;font-size:12px}
.hint{font-size:12px;color:var(--label2);margin:6px 16px 0;line-height:1.45}
.hint.erro{color:var(--red)}
.prev{padding:12px 16px 14px;border-top:1px solid var(--sep);background:var(--fill2)} .prev .pv-r{font-size:11px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.04em}
.prev .pv{margin-top:6px;padding:10px 12px;background:var(--card);border-radius:8px;border:1px solid var(--sep);font-size:14px;line-height:1.4}
.prev b{color:var(--label);font-weight:500}
.pills{display:flex;gap:6px;padding:0 16px 10px}
.pills button{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--fill);color:var(--blue);font-weight:600}
.switch{width:44px;height:26px;border-radius:99px;background:var(--fill);position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch[aria-checked=true]{background:var(--blue)} .switch[aria-checked=true]::after{left:20px}
details summary{list-style:none;color:var(--label2);font-size:13px;margin:20px 16px 6px;cursor:default}
details summary::before{content:"›";display:inline-block;margin-right:6px;transition:.2s} details[open] summary::before{transform:rotate(90deg)}

/* Cadastro */
#setup{position:fixed;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column;align-items:center;overflow:auto}
.setup-in{width:min(560px,92vw);padding:40px 0 32px}
.etapa{text-align:center;font-size:12px;color:var(--label2);margin-bottom:8px;font-weight:600;letter-spacing:.02em}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:22px}
.dots i{width:24px;height:4px;border-radius:2px;background:var(--fill);transition:.3s}
.dots i.on{background:var(--blue)}
.setup-in h2{font-size:26px;font-weight:700;letter-spacing:-.02em;text-align:center}
.setup-in .lead{color:var(--label2);text-align:center;margin:6px auto 22px;max-width:460px}
.setup-nav{display:flex;gap:10px;margin-top:26px}
.drop{border:1.5px dashed var(--sep);border-radius:var(--r);padding:24px;text-align:center;color:var(--label2);transition:.2s;background:var(--card);width:100%}
.drop.on,.drop:hover{border-color:var(--blue);color:var(--blue)}
.drop b{display:block;color:var(--label);font-weight:600;margin-bottom:2px}
.check{display:flex;gap:12px;align-items:center;padding:14px 16px}
.check>svg{color:var(--green);flex:none}

/* Folhas */
.scrim{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;z-index:9}
.scrim.on{display:flex;animation:fade .18s}
#scrim2{z-index:12}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:min(540px,92vw);max-height:88vh;display:flex;flex-direction:column;border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.28);animation:pop .22s cubic-bezier(.2,.9,.3,1.1)}
#sheet2{width:min(420px,90vw)}
#sheet2:has(#reg-txt){width:min(640px,92vw)}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.sh{padding:16px 16px 6px;text-align:center}
.sh h3{font-size:15px;font-weight:600}
.sh p{color:var(--label2);font-size:13px;margin-top:4px}
.sb{padding:0 16px 8px;overflow:auto}
.sf{display:flex;gap:10px;justify-content:flex-end;padding:12px 16px 16px;border-top:1px solid var(--sep)}
.tabs{display:flex;justify-content:center;margin:2px 0 4px}

.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%) translateY(16px);opacity:0;background:rgba(30,30,30,.94);color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;transition:.3s;z-index:20;max-width:80vw;display:flex;gap:12px;align-items:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{color:#FFB070;font-weight:600}
.busca-cli{position:relative;margin:2px 0 10px}
.busca-cli input{width:100%;border:0;outline:0;background:var(--card);box-shadow:var(--shadow);border-radius:10px;padding:10px 14px 10px 36px;font-size:14px}
.busca-cli svg{position:absolute;left:12px;top:12px;color:var(--label3)}
.resultados{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);z-index:8;max-height:360px;overflow:auto;padding:6px;border:1px solid var(--sep)}
.resultados .cli{padding:8px 10px 4px;font-size:12px;color:var(--label2);display:flex;justify-content:space-between;gap:8px}
.resultados button{display:flex;width:100%;text-align:left;padding:8px 10px;border-radius:8px;gap:10px;align-items:center}
.resultados button:hover,.resultados button.sel{background:var(--blue);color:#fff}
.resultados button:hover .s,.resultados button.sel .s{color:rgba(255,255,255,.8)}
.resultados .todas{color:var(--blue);font-weight:600}
.search{width:100%;border:0;outline:0;background:var(--fill);border-radius:9px;padding:8px 12px;margin-top:4px}
.filtro{display:flex;justify-content:flex-end;margin-top:8px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px;flex:none;letter-spacing:.02em}
.avatar.g{width:56px;height:56px;font-size:20px}
.perfil-btn{display:flex;align-items:center;gap:8px;border-radius:99px;padding:3px 10px 3px 3px;max-width:260px;transition:background var(--dur-1)} .perfil-btn:hover{background:var(--fill)}
.perfil-btn .nome{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .perfil-btn svg{color:var(--label2);flex:none}
.avatar.logo{background:#fff;overflow:hidden;box-shadow:inset 0 0 0 1px var(--sep)} .avatar.logo img{width:100%;height:100%;object-fit:contain}
.perfil-btn:hover,.perfil-btn[aria-expanded=true]{box-shadow:0 0 0 3px var(--fill)}
.perfis{position:fixed;top:64px;right:24px;width:340px;background:var(--card);border-radius:16px;box-shadow:0 16px 48px rgba(0,0,0,.22);border:1px solid var(--sep);z-index:15;padding:18px 8px 8px;animation:pop .18s}
:root[data-tema=escuro] .perfis{background:#2C2C2E}
.perfis .atual{text-align:center;padding:0 12px 14px}
.perfis .atual .avatar{margin:0 auto}
.perfis .atual b{display:block;margin-top:8px;font-size:15px}
.perfis .atual .s{white-space:normal}
.perfis .lista{border-top:1px solid var(--sep);padding-top:6px;max-height:320px;overflow:auto}
.perfis .item{display:flex;gap:12px;align-items:center;width:100%;padding:8px 10px;border-radius:10px;text-align:left}
.perfis .item:hover,.perfis .item:focus-visible{background:var(--fill2)}
.perfis kbd{margin-left:auto}
.menu{position:fixed;background:var(--card);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.22);padding:5px;z-index:15;min-width:230px;border:1px solid var(--sep)}
.menu button{display:flex;width:100%;padding:7px 10px;border-radius:6px;text-align:left;gap:8px;align-items:center}
.menu button:hover,.menu button:focus{background:var(--blue);color:#fff;outline:0}
.menu button.red{color:var(--red)} .menu button.red:hover,.menu button.red:focus{background:var(--red);color:#fff}
.menu .ck{width:14px;display:inline-grid;place-items:center}
.menu hr{border:0;border-top:1px solid var(--sep);margin:4px 6px}
</style>
</head>
<body>

<section id="setup" hidden aria-live="polite">
  <div class="aparencia"><span>Aparência</span><div class="seg" role="radiogroup" id="tema-setup" aria-label="Aparência"></div></div>
  <div class="setup-in">
    <div class="etapa" id="etapa"></div>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div id="passo"></div>
  </div>
</section>

<header>
  <div style="min-width:0">
    <h1 id="titulo">Emitir</h1>
    <div class="sub">
      <button class="empresa-btn" id="empresa-btn" aria-haspopup="dialog" data-a="painelPerfis"></button>
      <span id="amb" class="badge"></span>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="seg" role="tablist" id="abas">
    <button role="tab" aria-selected="true" data-v="emitir">Emitir</button>
    <button role="tab" aria-selected="false" data-v="clientes">Clientes</button>
    <button role="tab" aria-selected="false" data-v="historico">Histórico</button>
  </div>
  <button class="perfil-btn" id="perfil-btn" data-a="painelPerfis" aria-haspopup="dialog" aria-expanded="false" title="Trocar de empresa (Ctrl+Shift+E)"></button>
  <button class="icon-btn" title="Ajustes" aria-label="Ajustes" data-a="ajustes">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main>
  <section class="view on" id="v-emitir" role="tabpanel">
    <div id="avisos"></div>
    <div class="busca-cli" id="busca-cli" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q-cli" placeholder="Buscar cliente salvo e adicionar à lista" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="res-cli" aria-label="Buscar cliente salvo">
      <div class="resultados" id="res-cli" role="listbox" hidden></div>
    </div>
    <div class="empty" id="vazio">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15h6"/></svg>
      <h2>Nenhuma nota na lista</h2>
      <p>Busque um cliente salvo, arraste um PDF, cole uma lista com <kbd>Ctrl</kbd>+<kbd>V</kbd> ou adicione à mão.</p>
      <div class="actions">
        <button class="btn" data-a="editar">Adicionar nota</button>
        <button class="btn primary" data-a="escolherPdf">Importar PDF</button>
      </div>
    </div>
    <div id="lista"></div>
  </section>
  <section class="view" id="v-clientes" role="tabpanel"><div id="clientes"></div></section>
  <section class="view" id="v-historico" role="tabpanel">
    <input class="search" id="busca" placeholder="Buscar cliente, unidade ou número" aria-label="Buscar no histórico">
    <div id="hist"></div>
  </section>
</main>

<footer id="rodape"><div class="in">
  <div class="tot"><span id="qtd"></span><b class="num" id="total"></b><div class="barra" id="barra" hidden><i></i></div></div>
  <div class="spacer"></div>
  <button class="btn" id="b-sec"></button>
  <button class="btn primary" id="b-pri"></button>
</div></footer>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t"></div></div>
<div class="scrim" id="scrim2"><div class="sheet" id="sheet2" role="alertdialog" aria-modal="true" aria-labelledby="sheet2-t"></div></div>
<div class="toast" id="toast" role="status"><span id="toast-t"></span><button id="toast-b" hidden></button></div>
<input type="file" id="arquivo" hidden>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const api=()=>window.pywebview.api;
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dig=s=>String(s||'').replace(/\D/g,'');
const fmtDoc=d=>(d=dig(d)).length===14?d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5'):d.length===11?d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):d;
const parseValor=s=>{s=String(s).replace(/[^\d,.-]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return Math.round((parseFloat(s)||0)*100)/100};
const fmtCod=c=>(c=dig(c)).length===6?c.replace(/(\d{2})(\d{2})(\d{2})/,'$1.$2.$3'):c;
const fmtNbs=c=>(c=dig(c)).length===9?c.replace(/(\d)(\d{4})(\d{2})(\d{2})/,'$1.$2.$3.$4'):c;
const nomeSrv=x=>{const d=(x.nome||x.descricao_servico||'').replace(/\.$/,''); return d.length>48?d.slice(0,46)+'…':d;};
const fmtNum=v=>(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const plural=(n,a,b)=>`${n} ${n===1?a:b}`;
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const aplicarModelo=(m,u,c='')=>{const d=new Date();return m.replaceAll('{mes}',MESES[d.getMonth()]).replaceAll('{ano}',d.getFullYear()).replaceAll('{competencia}',String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()).replaceAll('{cliente}',c).replaceAll('{unidade}',u).replace(/(\s*-\s*)+$/,'')};
const lerArquivo=aceita=>new Promise(res=>{const i=$('#arquivo');i.accept=aceita;i.value='';
  i.onchange=()=>{const f=i.files[0];if(!f)return res(null);const r=new FileReader();r.onload=()=>res({nome:f.name,b64:r.result.split(',')[1]});r.readAsDataURL(f)};i.click()});
const ICON={
  ok:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1.2 14.2-4-4 1.4-1.4 2.6 2.6 5.6-5.6 1.4 1.4z"/></svg>',
  erro:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2zm0-4h-2V7h2z"/></svg>',
  x:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  seta:'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
  mais:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  lapis:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/></svg>',
  estrela:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
  lixo:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>',
  relogio:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  check:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>'};
const sw=(id,on,label)=>`<button class="switch" id="${id}" role="switch" aria-checked="${!!on}" aria-labelledby="${id}-l"></button>`;
const swOn=id=>$('#'+id).getAttribute('aria-checked')==='true';
const segBtns=(id,opts,atual,dis={})=>`<div class="seg" role="radiogroup" id="${id}">${opts.map(([v,t])=>`<button role="radio" data-v="${v}" aria-checked="${String(atual)===String(v)}" ${dis[v]?'disabled':''}>${t}</button>`).join('')}</div>`;
const segVal=id=>$(`#${id} [aria-checked=true]`)?.dataset.v;

const app={
  s:null, notas:[], st:[], fase:'lista', ignoradas:[], verTestes:false,

  async init(){
    this.s=await api().estado();
    this.aplicarTema(this.s.tema);
    if(!this.s.empresa) return this.cadastro();
    this.pronto();
    const up=await api().verificar_atualizacao(); if(up?.versao){ this.update=up; this.avisos(); }
  },
  pronto(){ $('#setup').hidden=true; this.cabecalho(); this.avisos(); this.render(); this.renderHistorico(); this.carregarClientes(); this.carregarLista(); },
  async carregarClientes(){ this.clis=await api().clientes_salvos(); $('#busca-cli').hidden=!this.clis.length; },

  /* ================= Clientes salvos ================= */
  buscarCli(){
    const q=$('#q-cli').value.trim().toLowerCase(), box=$('#res-cli'), qd=dig(q);
    if(!q){ box.hidden=true; $('#q-cli').setAttribute('aria-expanded','false'); return; }
    const achados=this.clis.map(c=>{ const nomeOk=c.nome.toLowerCase().includes(q)||(qd.length>=3&&c.cnpj.includes(qd));
      const us=c.unidades.filter(u=>nomeOk||u.nome.toLowerCase().includes(q)); return (nomeOk||us.length)?{...c,us:nomeOk?c.unidades:us}:null; }).filter(Boolean).slice(0,8);
    this._res=[]; let html='';
    for(const c of achados){
      html+=`<div class="cli"><span>${esc(c.nome)}</span><span class="num">${fmtDoc(c.cnpj)}</span></div>`;
      const us=c.us.length?c.us:[{nome:'',valor:0}];
      us.forEach(u=>{ this._res.push({c,u}); html+=`<button role="option" data-r="${this._res.length-1}"><div class="main"><div class="t">${esc(u.nome||c.nome)}</div></div>${u.valor?`<span class="s num">último ${brl(u.valor)}</span>`:''}</button>`; });
      if(c.us.length>1){ this._res.push({c,todas:c.us}); html+=`<button role="option" class="todas" data-r="${this._res.length-1}">Adicionar as ${c.us.length} unidades</button>`; }
    }
    box.innerHTML=html||`<div class="cli">Nenhum cliente salvo com “${esc(q)}”. Clientes são salvos ao emitir a primeira nota.</div>`;
    box.hidden=false; $('#q-cli').setAttribute('aria-expanded','true'); this._sel=0; this.marcarSel();
  },
  marcarSel(){ $$('#res-cli button').forEach((b,i)=>b.classList.toggle('sel',i===this._sel)); $$('#res-cli button')[this._sel]?.scrollIntoView({block:'nearest'}); },
  async escolherCli(r){
    const x=this._res[r]; if(!x) return;
    $('#q-cli').value=''; this.buscarCli();
    if(this.fase!=='lista') this.reset();
    const nota=async u=>({cnpj:x.c.cnpj,nome:x.c.nome,unidade:u.nome,valor:u.valor||0,descricao:await api().descricao_cliente(x.c.cnpj,u.nome)});
    if(x.todas){
      for(const u of x.todas) this.notas.push(await nota(u));
      this.aba('emitir'); this.render(); return this.toast(`${plural(x.todas.length,'unidade adicionada','unidades adicionadas')} com o último valor. Clique para ajustar.`);
    }
    this.editar(null,null,await nota(x.u));
  },

  cabecalho(){
    const e=this.s.empresa, p=e.ambiente==='producao';
    $('#empresa-btn').hidden=true;
    const a=$('#amb'); a.hidden=p; a.textContent='Modo teste · notas sem validade fiscal'; a.className='badge teste';
    $('#perfil-btn').innerHTML=(e.logo_url?`<span class="avatar logo"><img src="${e.logo_url}" alt=""></span>`:this.av({cnpj:e.cnpj,nome:e.apelido||e.nome}))
      +`<span class="nome">${esc(e.apelido||e.nome)}</span>${ICON.seta}`; $('#perfil-btn').setAttribute('aria-label',`Empresa: ${e.apelido||e.nome}. Trocar de empresa`);
  },
  avisos(){
    const e=this.s.empresa, c=this.s.certificado||{}, out=[];
    if(this.update) out.push(`<div class="banner info"><span class="spacer">NotF ${esc(this.update.versao)} disponível. O programa fecha e abre de novo sozinho.</span><button class="btn primary" data-a="atualizar">Atualizar</button></div>`);
    if(c.erro) out.push(`<div class="banner erro"><span class="spacer">${esc(c.erro)}</span><button class="btn" data-a="trocarCert">Importar certificado</button></div>`);
    else if(c.dias!==undefined&&c.dias<0) out.push(`<div class="banner erro"><span class="spacer">O certificado venceu em ${esc(c.validade)}. Não é possível emitir.</span><button class="btn" data-a="trocarCert">Trocar certificado</button></div>`);
    else if(c.dias!==undefined&&c.dias<30) out.push(`<div class="banner warn"><span class="spacer">O certificado vence em ${esc(c.validade)}. Depois disso não será possível emitir.</span><button class="btn" data-a="trocarCert">Trocar certificado</button></div>`);
    if(e.ambiente==='teste'&&e.teste_ok) out.push(`<div class="banner info"><span class="spacer">Teste concluído. Pronto para emitir de verdade?</span><button class="btn primary" data-a="ligarProducao">Ligar produção</button></div>`);
    if(this.erroEnvio) out.push(`<div class="banner erro"><span class="spacer">Não foi possível enviar: ${esc(this.erroEnvio)}</span><button class="btn" data-a="emitirTudo">Tentar de novo</button></div>`);
    $('#avisos').innerHTML=out.join('');
  },

  aba(v){
    if(this.selModo&&this._abaAtual!==v){ this.selModo=false; this.selH.clear(); this.barraSel(); } this._abaAtual=v;
    $$('#abas button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
    $$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
    $('#titulo').textContent={emitir:'Emitir',clientes:'Clientes',historico:'Histórico'}[v];
    if(v==='clientes') this.renderClientes();
    this.rodape();
  },
  rodape(){ $('#rodape').classList.toggle('on',$('#v-emitir').classList.contains('on')&&this.notas.length>0); },

  /* ================= Cadastro ================= */
  cad:{}, passo:0,
  cadastro(){ this.cad={servico:{},guardar:true}; this.passo=0; $('#setup').hidden=false; this.renderPasso(); },
  renderPasso(){
    const c=this.cad;
    $('#etapa').textContent=`ETAPA ${this.passo+1} DE 4`;
    $$('.dots i').forEach((d,i)=>d.classList.toggle('on',i<=this.passo));
    const voltar=`<button class="btn" data-a="irPasso" data-n="-1">Voltar</button>`;
    const P=[
      ()=>`<h2>Certificado da empresa</h2>
        <p class="lead">Ele identifica a empresa e autoriza a emissão na Receita. Use o certificado digital A1 (e-CNPJ), arquivo .pfx ou .p12, emitido por uma certificadora ICP-Brasil.</p>
        <button class="drop ${c.arq?'on':''}" data-a="escolherPfx"><b>${c.arq?esc(c.arq.nome):'Escolher arquivo do certificado'}</b>${c.arq?'Clique para trocar':'.pfx ou .p12'}</button>
        <div class="group" style="margin-top:14px">
          <div class="field" id="fc-senha"><label for="c-senha">Senha</label><input id="c-senha" type="password"  autocomplete="off"><button class="olho" data-a="olho" data-alvo="c-senha" aria-label="Mostrar senha">Mostrar</button></div>
          <div class="field"><span class="lbl" id="c-guardar-l">Guardar a senha</span><span class="spacer"></span>${sw('c-guardar',c.guardar)}</div>
        </div>
        <p class="hint">Desligado, o NotF pede a senha a cada envio. Indicado para computadores compartilhados.</p>
        <div class="setup-nav">${this.s.empresas.length?'<button class="btn" data-a="sairCadastro">Cancelar</button>':''}<span class="spacer"></span>
          <button class="btn primary big" id="ok" data-a="lerCert">Continuar</button></div>`,
      ()=>`<h2>Dados da empresa</h2>
        <div class="group" style="margin-bottom:6px"><div class="check">${ICON.ok}<div><b>${esc(c.cert.nome)}</b><div class="s">CNPJ ${fmtDoc(c.cert.cnpj)} · certificado válido até ${esc(c.cert.validade)}</div></div></div></div>
        <p class="lead" style="margin-top:12px">Preenchidos pelo CNPJ. Confira e ajuste se precisar.</p>
        <div class="group">
          <div class="field" id="fe-nome"><label class="req" for="e-nome">Razão social</label><input id="e-nome" value="${esc(c.empresa.nome)}"></div>
          <div class="field"><label for="e-apelido">Nome curto</label><input id="e-apelido" value="${esc(c.empresa.apelido||'')}" ></div>
          <div class="field"><label class="req" for="e-mun">Município</label><input id="e-mun" value="${esc(c.empresa.municipio||'')}" placeholder="Ex.: São Paulo/SP"></div>
          <div class="field" id="fe-ibge"><label class="req" for="e-ibge">Código do município</label><input id="e-ibge" class="num" value="${esc(c.empresa.municipio_ibge||'')}"  maxlength="7"></div>
        </div>
        <p class="hint">${c.empresa.municipio_ibge?'Código do IBGE, preenchido pelo CNPJ.':'Não veio pelo CNPJ. Busque “código IBGE '+esc(c.empresa.municipio||'sua cidade')+'” na internet (são 7 números).'}</p>
        <div class="gt">Regime tributário</div>
        <div class="group">

  cartaoProgresso(){

    return `<div class="progresso" role="status" aria-live="polite">
      <div class="topo"><b>${fim?(erro?'Envio concluído':'Notas emitidas'):'Emitindo notas'}</b><span class="s">${feitos} de ${total}</span><span class="pct">${pct}%</span></div>
      <div class="trilho ${fim?(erro?'fim-erro':'fim'):''}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${Math.max(pct,2)}%"></i></div>
      <div class="agora">${agora}</div>
      <div class="cont"><span><b>${ok}</b> emitidas</span>${erro?`<span><b style="color:var(--red)">${erro}</b> com erro</span>`:''}<span><b>${total-feitos}</b> na fila</span></div></div>`;

    if(!r) return;
    if(!r.ok){ this.erroEnvio=r.erro; this.avisos(); return; }
    this.fase='enviando'; this.fila=idx; idx.forEach(i=>this.st[i]={status:'aguardando'}); this.render();
    clearInterval(this._tick); this._tick=setInterval(()=>{ if(this.fase!=='enviando') return clearInterval(this._tick); const c=$('.progresso'); if(c) c.outerHTML=this.cartaoProgresso(); },1000);

  evento(nome,d){
    if(nome==='email') this.toast(d.ok?`Nota nº ${d.numero} enviada para ${d.para}`:`Nota nº ${d.numero} não foi enviada por e-mail: ${d.erro}`);
    if(nome==='progresso'){ this.verificando=false; if(d.status==='enviando') d.inicio=Date.now(); this.st[this.fila[d.i]]=d; this.render(); }
    if(nome==='pdf'){ if(d.estado) this.s=d.estado; this.st.forEach(s=>{ if(s?.item?.chave===d.chave) s.item.pdf=d.pdf; });
      this.render(); this.renderHistorico(); this.toast('PDF da nota disponível'); }

    if(nome==='etapa'){ const s=this.st[this.fila[d.i]]; if(s){ s.etapa=d.etapa; this.render(); } }
    if(nome==='fim'){ this.fase='pronto'; this.verificando=false; this.bloqueio=d.bloqueio||null; if(d.estado) this.s=d.estado; this.avisos();
      api().salvar_rascunho(this.notas.filter((_,i)=>this.st[i]?.status!=='ok'));
      this._clis=null; this.render(); this.renderHistorico(); this.carregarClientes();
      if(!d.bloqueio) this.toast(d.ok===d.total?plural(d.ok,'nota emitida','notas emitidas'):`${d.ok} de ${d.total} emitidas`); }
  },

  async carregarDadosCliente(cnpj,box='#cli-dados'){
    const r=await api().cliente(cnpj); if(!r.ok||!$(box)) return; const c=r.cliente, P=box==='#cli-dados'?'c':'n';
    const F=[['nome','Nome / Razão social',''],['email','E-mail',''],['fone','Telefone','(00) 00000-0000'],['im','Inscrição Municipal',''],
      ['cep','CEP','00000-000'],['logradouro','Endereço',''],['numero','Número',''],['complemento','Complemento',''],
      ['bairro','Bairro',''],['municipio','Cidade',''],['uf','Estado','']].filter(f=>P==='c'||f[0]!=='nome');
    $(box).innerHTML=F.map(([k,r,ph])=>`<div class="field" id="f${P}-${k}"><label for="${P}-${k}" class="${k==='nome'?'req':''}">${r}</label><input id="${P}-${k}" data-k="${k}" value="${esc(c[k]||'')}" placeholder="${ph}" ${k==='uf'?'maxlength="2" style="text-transform:uppercase"':''}></div>`).join('')
      +`<div class="field col" id="f${P}-info"><label for="${P}-info">Informações complementares</label><input id="${P}-info" data-k="info" value="${esc(c.info||'')}" ></div>`;
    const cepIn=$(`#${P}-cep`); let ultimoCep=dig(cepIn.value);
    const buscarCep=async()=>{ const d=dig(cepIn.value); if(d.length!==8||d===ultimoCep) return; ultimoCep=d;
      const alvos=['logradouro','bairro','municipio','uf'].map(k=>$(`#${P}-${k}`));
      alvos.forEach(x=>{ x.closest('.field').classList.add('carregando'); x.value=''; x.placeholder='Buscando…'; });
      const r=await api().consultar_cep(d);
      alvos.forEach(x=>{ x.closest('.field').classList.remove('carregando'); x.placeholder=''; });
      if(!r.ok){ this.invalido(`f${P}-cep`,r.erro); return; }
      const campos={cep:d,...r.dados}; for(const [k,v] of Object.entries(r.dados)){ const x=$(`#${P}-${k}`); if(x) x.value=v||''; }
      cepIn.value=d.replace(/(\d{5})(\d{3})/,'$1-$2');
      const s2=await api().salvar_dados_cliente(cnpj,campos); if(!s2.ok) return this.toast(s2.erro);
      this._clis=null; this.carregarClientes(); this.toast('Endereço preenchido pelo CEP. Complete o número.'); $(`#${P}-numero`).focus(); };
    cepIn.addEventListener('input',()=>{ if(dig(cepIn.value).length===8) buscarCep(); });
    $$(box+' input').forEach(i=>i.addEventListener('change',async()=>{
      const k=i.dataset.k; if(k==='nome'&&!i.value.trim()) return; if(k==='cep'){ if(dig(i.value).length===8) return buscarCep(); }
      const r=await api().salvar_dados_cliente(cnpj,{[k]:k==='uf'?i.value.toUpperCase():i.value});
      if(!r.ok) return this.invalido(`f${P}-`+(r.campo||k),r.erro);
      for(const [kk,v] of Object.entries(r.preenchidos||{})){ const x=$(`#${P}-${kk}`); if(x) x.value=v; }
      if(k==='nome'&&$('#f-nome')) $('#f-nome').value=i.value;
      this._clis=null; this.carregarClientes();
      this.toast(Object.keys(r.preenchidos||{}).length?'Endereço preenchido pelo CEP':'Cliente atualizado');
      if(k==='cep'&&Object.keys(r.preenchidos||{}).length) $(`#${P}-numero`)?.focus();

  /* ================= Histórico ================= */
  renderHistorico(){

    if(!h.length){
      $('#hist').innerHTML=filtro+(q?`<p class="hint" style="text-align:center;margin-top:40px">Nada encontrado para “${esc(q)}”.</p>`
        :`<div class="empty"><h2>Nenhuma nota emitida ainda</h2><p>As notas emitidas aparecem aqui, com PDF e XML.</p><div class="actions"><button class="btn primary" data-a="irEmitir">Emitir notas</button></div></div>`);

    $('#hist').innerHTML=filtro+[...meses].map(([m,idx])=>`
      <div class="gt"><span>${this.selModo?`<button class="link" data-a="selMes" data-m="${esc(m)}">${idx.every(i=>this.selH.has(h[i].chave))?'Desmarcar':'Marcar'} ${esc(m)}</button>`:esc(m)}</span><span></span></div>
      <div class="group">${idx.map(i=>{const x=h[i];return `<div class="row ${x.situacao==='cancelada'?'cancelada':''}">${this.selModo&&x.chave?`<button class="check-n" role="checkbox" aria-checked="${this.selH.has(x.chave)}" data-a="selNota" data-k="${esc(x.chave)}" aria-label="Selecionar nota ${esc(x.numero)}">${this.selH.has(x.chave)?ICON.check:''}</button>`:''}
        <div class="main"><div class="t">${esc(x.unidade||x.nome)}${x.ambiente==='teste'?'<span class="badge teste">Teste</span>':''}${x.situacao==='cancelada'?'<span class="badge cancel">Cancelada</span>':''}${x.situacao==='pendente'?'<span class="badge teste">A confirmar</span>':''}</div>
        <div class="s">${x.numero?'Nº '+esc(x.numero)+' · ':''}${esc(x.data)} · ${esc(x.nome)}</div></div>
        <div class="v num">${brl(x.valor)}</div>

  },

  menuEmpresas(_,el){
    const trocar=async cnpj=>{ const r=await api().trocar_empresa(cnpj); if(!r.ok) return this.toast(r.erro); this.s=r.estado; this.reset(); this.pronto(); };
    this.menu(el,[...this.s.empresas.map(x=>[x.nome,()=>{
      if(x.cnpj===this.s.empresa.cnpj) return;
      if(this.fase==='enviando') return this.toast('Aguarde o envio terminar.');
      this.notas.length&&this.fase==='lista'?this.confirmar('Trocar de empresa?','A lista atual será descartada.','Trocar',false,()=>trocar(x.cnpj)):trocar(x.cnpj);
    },'',x.cnpj===this.s.empresa.cnpj]),'-',['Adicionar empresa…',()=>this.cadastro()]]);
  },
  async buscarAtualizacao(){
    const v=$('#a-upd'), b=$('#b-upd'); v.innerHTML='<span class="spin" style="display:inline-block;vertical-align:middle"></span>'; b.disabled=true;
    const up=await api().verificar_atualizacao(); b.disabled=false;
    if(up?.versao){ this.update=up; this.avisos(); v.textContent=`Versão ${up.versao} disponível`; b.textContent='Atualizar agora'; b.dataset.a='atualizar'; }
    else { v.textContent=up?.atual?'Você está na versão mais recente':up?.erro||'Sem conexão. Tente de novo.'; v.style.whiteSpace='normal'; }
  },
  async atualizar(){
    this.fechar();
    this.folha2(`Atualizando para a versão ${esc(this.update?.versao||'')}`,'Baixando e instalando. O NotF fecha e abre de novo sozinho, em poucos segundos.',
      '<div class="trilho" style="margin:6px 0 10px"><i style="width:100%"></i></div>','Aguarde',()=>{},{soOk:true});
    $('#sheet2-ok').disabled=true;
    const r=await api().instalar_atualizacao();
    if(!r.ok){ this.fechar2(); this.toast(r.erro); }
  },

  /* ================= Perfis de empresa ================= */
  iniciais(n){ const p=String(n||'?').replace(/\b(LTDA|ME|EPP|EIRELI|S\/?A|SERVICOS?|COMERCIO|DE|DA|DO|DOS|DAS|E)\b/gi,' ').split(/[^A-Za-zÀ-ÿ0-9]+/).filter(Boolean); return ((p[0]||'?')[0]+(p[1]?.[0]||'')).toUpperCase(); },
  cor(cnpj){ const c=['#007AFF','#34C759','#FF9500','#AF52DE','#FF2D55','#5AC8FA','#5856D6','#FF6B00','#00A88F','#8E8E93']; return c[[...String(cnpj)].reduce((a,d)=>a+ +d,0)%c.length]; },
  av(e,g){ return `<span class="avatar ${g?'g':''}" style="background:${this.cor(e.cnpj)}" aria-hidden="true">${esc(this.iniciais(e.nome))}</span>`; },
  painelPerfis(){
    if($('.perfis:not(.saindo)')) return this.fecharPerfis();
    const e=this.s.empresa, outras=this.s.empresas.filter(x=>x.cnpj!==e.cnpj);
    const p=document.createElement('div'); p.className='perfis'; p.setAttribute('role','dialog'); p.setAttribute('aria-label','Empresas');
    p.innerHTML=`<div class="atual">${this.av({cnpj:e.cnpj,nome:e.apelido||e.nome},true)}<b>${esc(e.apelido||e.nome)}</b>
        <div class="s">${esc(e.nome)}<br>CNPJ ${fmtDoc(e.cnpj)} · ${e.ambiente==='producao'?'Produção':'Teste'}</div>
        <button class="btn" style="margin-top:12px" data-a="ajustesDoPerfil">Ajustes desta empresa</button></div>
      <div class="lista">${outras.map((x,i)=>`<button class="item" data-a="trocarPerfil" data-c="${esc(x.cnpj)}">${this.av(x)}<div class="main"><div class="t">${esc(x.nome)}</div><div class="s">${fmtDoc(x.cnpj)}${x.ambiente!=='producao'?' · Teste':''}</div></div>${i<8?`<kbd>Ctrl+${i+2}</kbd>`:''}</button>`).join('')}
        <button class="item" data-a="novaEmpresa"><span class="avatar" style="background:var(--fill);color:var(--blue);font-size:18px">+</span><div class="main"><div class="t" style="color:var(--blue)">Adicionar empresa</div></div></button></div>`;
    document.body.appendChild(p); $('#perfil-btn').setAttribute('aria-expanded','true');
    (p.querySelector('.lista .item')||p.querySelector('button')).focus();
    setTimeout(()=>document.addEventListener('mousedown',this._fp=ev=>{ if(!ev.target.closest('.perfis,#perfil-btn')) this.fecharPerfis(); }));
  },
  fecharPerfis(){ const pf=$('.perfis:not(.saindo)'); if(pf){ pf.classList.add('saindo'); setTimeout(()=>pf.remove(),110); } $('#perfil-btn')?.setAttribute('aria-expanded','false'); document.removeEventListener('mousedown',this._fp); },
  ajustesDoPerfil(){ this.fecharPerfis(); this.ajustes('empresa'); },
  trocarPerfil(_,el){ this.fecharPerfis(); this.irParaEmpresa(el.dataset.c); },
  irParaEmpresa(cnpj){
    if(!cnpj||cnpj===this.s.empresa.cnpj) return;
    if(this.fase==='enviando') return this.toast('Aguarde o envio terminar.');
    const ir=async()=>{ const r=await api().trocar_empresa(cnpj); if(!r.ok) return this.toast(r.erro); this.s=r.estado; this.reset(); this.pronto();
      this.toast(`Agora em ${this.s.empresa.apelido||this.s.empresa.nome}`); };
    this.notas.length&&this.fase==='lista'?this.confirmar('Trocar de empresa?','A lista atual será descartada.','Trocar',false,ir):ir();
  },

  /* ================= Aparência ================= */
  tema:'claro',
  aplicarTema(t){
    this.tema=t||'claro';
    const escuro=this.tema==='escuro'||(this.tema==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.tema=escuro?'escuro':'claro';
    ['tema-setup','tema-ajustes'].forEach(id=>{ const el=$('#'+id); if(!el) return;
      el.innerHTML=[['claro','Claro'],['escuro','Escuro'],['auto','Automático']].map(([v,n])=>`<button role="radio" data-v="${v}" aria-checked="${this.tema===v}">${n}</button>`).join('');
      el.querySelectorAll('button').forEach(b=>b.onclick=()=>{ this.aplicarTema(b.dataset.v); api().definir_tema(b.dataset.v); }); });
  },
  olho(_,el){ const i=$('#'+el.dataset.alvo), ver=i.type==='password'; i.type=ver?'text':'password';
    el.textContent=ver?'Ocultar':'Mostrar'; el.setAttribute('aria-label',ver?'Ocultar senha':'Mostrar senha'); i.focus(); },

  /* ================= Componentes ================= */
  segs(cb,ids){ (ids||[]).forEach(id=>$$(`#${id} button`).forEach(b=>b.onclick=()=>{ if(b.disabled) return; $$(`#${id} button`).forEach(x=>x.setAttribute('aria-checked',x===b)); cb&&cb(b.dataset.v,id); })); },
  previa(id){ const i=$('#'+id), p=$('#'+id+'-prev'), f=()=>p.innerHTML=`<span class="pv-r">Como fica na nota</span><div class="pv">${esc(aplicarModelo(i.value,'Unidade Centro','Cliente Exemplo Ltda'))||'—'}</div>`; i.oninput=f; f(); },
  inserir(_,el){ const i=$('#'+el.dataset.alvo), pos=i.selectionStart??i.value.length; i.value=i.value.slice(0,pos)+el.dataset.t+i.value.slice(i.selectionEnd??pos); i.focus(); i.dispatchEvent(new Event('input')); },
  invalido(id,msg){
    $$('.field.invalido').forEach(f=>{f.classList.remove('invalido');f.querySelector('[aria-invalid]')?.removeAttribute('aria-invalid')});
    $$('.hint.erro').forEach(h=>h.remove());
    const f=$('#'+id); if(!f) return this.toast(msg);
    f.classList.add('invalido'); const inp=f.querySelector('input,textarea,select'); inp?.setAttribute('aria-invalid','true');
    const h=document.createElement('p'); h.className='hint erro'; h.id=id+'-erro'; h.setAttribute('role','alert'); h.textContent=msg;
    f.closest('.group').after(h); inp?.setAttribute('aria-describedby',h.id); inp?.focus();
    const limpa=()=>{ f.classList.remove('invalido'); h.remove(); inp?.removeAttribute('aria-invalid'); }; inp?.addEventListener('input',limpa,{once:true});
  },
  async comSenha(fn){
    const r=await fn(null);
    if(r&&r.ok===false&&r.erro==='SENHA') return new Promise(res=>this.pedirSenha(async s=>res(await fn(s)),'Senha do certificado',()=>res(null)));
    return r;
  },
  pedirSenha(cb,titulo='Senha do certificado',cancel){
    this.folha2(titulo,'Necessária para assinar. Não fica guardada.',`<div class="group"><div class="field" id="fp-senha"><label for="p-senha">Senha</label><input id="p-senha" type="password" autocomplete="off"><button class="olho" data-a="olho" data-alvo="p-senha" aria-label="Mostrar senha">Mostrar</button></div></div>`,
      'Continuar',()=>{ const s=$('#p-senha').value; if(!s) return this.invalido('fp-senha','Digite a senha.'); this.fechar2(); cb(s); },{onCancel:cancel});
    $('#p-senha').focus();
  },
  confirmar(titulo,texto,ok,destrutivo,acao,onCancel,cancelar){
    this.folha2(titulo,texto,'',ok,()=>{ this.fechar2(); acao(); },{destrutivo,onCancel,...(cancelar?{cancelar}:{})});
    if(!destrutivo) $('#sheet2-ok').focus();
  },
  _montar(sel,id,titulo,sub,corpo,ok,acao,{cancelar='Cancelar',destrutivo=false,onCancel,soOk=false,extra='',larga=false}={}){
    const el=$(sel); el.classList.toggle('larga',!!larga); this[`_volta_${id}`]=document.activeElement; this[`_cancel_${id}`]=onCancel;
    el.innerHTML=`<div class="sh"><h3 id="${id}-t">${esc(titulo)}</h3>${sub?`<p>${esc(sub)}</p>`:''}</div>${corpo?`<div class="sb">${corpo}</div>`:''}
      <div class="sf">${extra}<span class="s spacer" id="${id}-status" role="status" style="align-self:center"></span><button class="btn" id="${id}-c" ${soOk?'hidden':''}>${esc(cancelar)}</button><button class="btn ${destrutivo?'red':'primary'}" id="${id}-ok">${esc(ok)}</button></div>`;
    el.parentNode.classList.add('on');
    el.parentNode.onmousedown=ev=>{ if(ev.target===el.parentNode&&!soOk||ev.target===el.parentNode&&larga) id==='sheet'?this.fechar(true):this.fechar2(true); };
    const okBtn=$(`#${id}-ok`);
    okBtn.onclick=async()=>{ if(okBtn.dataset.ocupado) return; okBtn.dataset.ocupado='1'; okBtn.disabled=true;
      try{ await acao(); } finally{ delete okBtn.dataset.ocupado; if(okBtn.isConnected) okBtn.disabled=false; } };
    $(`#${id}-c`).onclick=()=>id==='sheet'?this.fechar(true):this.fechar2(true);
    el.onkeydown=e=>{
      if(e.key==='Enter'&&e.target.tagName==='INPUT'){ e.preventDefault(); if(!e.target.closest('.lupa')) okBtn.click(); }
      if(e.key==='Tab'){ const f=[...el.querySelectorAll('button:not([disabled]):not([hidden]),input,select,textarea,summary')].filter(x=>x.offsetParent); if(!f.length) return;
        if(e.shiftKey&&document.activeElement===f[0]){ e.preventDefault(); f.at(-1).focus(); } else if(!e.shiftKey&&document.activeElement===f.at(-1)){ e.preventDefault(); f[0].focus(); } }
    };
    clearTimeout(this[`_saida_${id}`]); el.parentNode.classList.remove('saindo');
    setTimeout(()=>{ if(!el.contains(document.activeElement)) (el.querySelector('input,textarea,select')||(destrutivo?$(`#${id}-c`):okBtn)).focus(); });
  },
  folha(titulo,sub,corpo,ok,acao,op){ this._montar('#sheet','sheet',titulo,sub,corpo,ok,acao,op); },
  folha2(titulo,sub,corpo,ok,acao,op){ this._montar('#sheet2','sheet2',titulo,sub,corpo,ok,acao,op); },
  fechar(cancelado){ if(!$('#scrim').classList.contains('on')) return; this._sair('#scrim','sheet'); if(cancelado) this._cancel_sheet?.(); this._volta_sheet?.focus?.(); },
  _sair(sel,id){ const sc=$(sel); sc.classList.add('saindo'); clearTimeout(this[`_saida_${id}`]);
    this[`_saida_${id}`]=setTimeout(()=>sc.classList.remove('on','saindo'),matchMedia('(prefers-reduced-motion: reduce)').matches?0:150); },
  fechar2(cancelado){ if(!$('#scrim2').classList.contains('on')) return; this._sair('#scrim2','sheet2'); if(cancelado) this._cancel_sheet2?.(); (this._volta_sheet2?.isConnected?this._volta_sheet2:$('#sheet-ok'))?.focus?.(); },
  menu(el,itens){
    this.fecharMenu(); const m=document.createElement('div'); m.className='menu'; m.setAttribute('role','menu');
    itens.filter(Boolean).forEach(it=>{ if(it==='-'){ m.appendChild(document.createElement('hr')); return; }
      const b=document.createElement('button'); b.setAttribute('role','menuitem'); if(it[2]) b.className=it[2];
      b.innerHTML=`${it.length>3?`<span class="ck">${it[3]?ICON.check:''}</span>`:''}<span></span>`; b.lastChild.textContent=it[0];
      b.onclick=()=>{ this.fecharMenu(); it[1](); }; b.onmouseenter=()=>b.focus({preventScroll:true}); m.appendChild(b); });
    document.body.appendChild(m); const r=el.getBoundingClientRect();
    m.style.top=Math.min(r.bottom+4,innerHeight-m.offsetHeight-8)+'px'; m.style.left=Math.max(8,Math.min(r.left,innerWidth-m.offsetWidth-8))+'px';
    const bs=[...m.querySelectorAll('button')]; bs[0]?.focus(); this._menuOrigem=el;
    m.onkeydown=e=>{ const i=bs.indexOf(document.activeElement);
      if(e.key==='ArrowDown'){ e.preventDefault(); bs[(i+1)%bs.length].focus(); } if(e.key==='ArrowUp'){ e.preventDefault(); bs[(i-1+bs.length)%bs.length].focus(); } };
    setTimeout(()=>document.addEventListener('click',()=>this.fecharMenu(),{once:true}));
  },
  fecharMenu(){ const m=$('.menu:not(.saindo)'); if(m){ m.classList.add('saindo'); setTimeout(()=>m.remove(),matchMedia('(prefers-reduced-motion: reduce)').matches?0:110); this._menuOrigem?.focus(); } },
  carregando(sel,txt){ const b=$(sel); if(b){ b.disabled=true; b.textContent=txt; } },
  toast(t,acao){
    const el=$('#toast'), b=$('#toast-b'); $('#toast-t').textContent=t; b.hidden=!acao;
    if(acao){ b.textContent=acao.acao; b.onclick=()=>{ el.classList.remove('on'); acao.fn(); }; }
    el.classList.add('on'); clearTimeout(this._t); this._t=setTimeout(()=>el.classList.remove('on'),Math.max(3500,t.length*70)+(acao?2500:0));
  },
};

/* Delegação de cliques: nenhum dado entra em atributos de evento. */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el||el.disabled) return;
  const fn=app[el.dataset.a]; if(typeof fn!=='function') return;
  e.stopPropagation(); if(el.dataset.a==='irPasso') return app.irPasso(el.dataset.n);
  if(el.getAttribute('role')==='switch') return;
  fn.call(app,e,el);
});
document.addEventListener('click',e=>{ const s=e.target.closest('[role=switch]'); if(!s) return;
  s.setAttribute('aria-checked',s.getAttribute('aria-checked')!=='true'); s.dispatchEvent(new Event('change',{bubbles:true})); });
$$('#abas button').forEach(b=>b.onclick=()=>app.aba(b.dataset.v));
$('#busca').oninput=()=>app.renderHistorico();
$('#q-cli').oninput=()=>app.buscarCli();
$('#q-cli').onkeydown=e=>{ const n=$$('#res-cli button').length; if(!n) return;
  if(e.key==='ArrowDown'){ e.preventDefault(); app._sel=(app._sel+1)%n; app.marcarSel(); }
  if(e.key==='ArrowUp'){ e.preventDefault(); app._sel=(app._sel-1+n)%n; app.marcarSel(); }
  if(e.key==='Enter'){ e.preventDefault(); app.escolherCli(+$$('#res-cli button')[app._sel].dataset.r); }
  if(e.key==='Escape'){ $('#q-cli').value=''; app.buscarCli(); } };
$('#res-cli').onclick=e=>{ const b=e.target.closest('button[data-r]'); if(b){ e.stopPropagation(); app.escolherCli(+b.dataset.r); } };
document.addEventListener('mousedown',e=>{ if(!e.target.closest('#busca-cli')) $('#res-cli').hidden=true; });
document.addEventListener('keydown',e=>{
  if($('#setup').hidden&&app.s?.empresa&&(e.ctrlKey||e.metaKey)&&!e.altKey){
    if(e.shiftKey&&e.key.toLowerCase()==='e'){ e.preventDefault(); return app.painelPerfis(); }
    const n=+e.key; if(n>=1&&n<=9&&!e.shiftKey){ const outras=app.s.empresas.filter(x=>x.cnpj!==app.s.empresa.cnpj);
      const alvo=n===1?app.s.empresa:outras[n-2]; if(alvo){ e.preventDefault(); app.fecharPerfis(); app.irParaEmpresa(alvo.cnpj); } return; }
  }
  if(e.key==='Escape'){ if($('.perfis')) return app.fecharPerfis(); if($('.menu')) return app.fecharMenu(); if($('#scrim2').classList.contains('on')) return app.fechar2(true); app.fechar(true); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&!$('#busca-cli').hidden&&$('#setup').hidden){ e.preventDefault(); app.aba('emitir'); $('#q-cli').focus(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'&&app.fase==='lista'&&$('#setup').hidden&&!$('#scrim').classList.contains('on')){ e.preventDefault(); app.editar(); }
});
document.addEventListener('paste',async e=>{
  if($('#scrim').classList.contains('on')||!$('#setup').hidden||app.fase==='enviando'||/INPUT|TEXTAREA/.test(document.activeElement?.tagName)) return;
  const t=e.clipboardData.getData('text'); if(!t) return; e.preventDefault(); app.adicionar(await api().importar_texto(t));
});
document.addEventListener('dragover',e=>{ e.preventDefault(); document.body.classList.add('drag'); });
document.addEventListener('dragleave',e=>{ if(!e.relatedTarget) document.body.classList.remove('drag'); });
document.addEventListener('drop',e=>{
  e.preventDefault(); document.body.classList.remove('drag');
  if(!$('#setup').hidden||app.fase==='enviando') return;
  const f=e.dataTransfer.files[0]; if(!f||!/\.pdf$/i.test(f.name)) return app.toast('Arraste um arquivo PDF.');
  const r=new FileReader(); r.onload=async()=>app.adicionar(await api().importar_pdf(r.result.split(',')[1])); r.readAsDataURL(f);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(app.tema==='auto') app.aplicarTema('auto'); });
app.aplicarTema('claro');
window.addEventListener('pywebviewready',()=>app.init());
</script>
</body>
</html>
